name: AlgoArena sentiment research

on:
  pull_request:
    paths:
      - 'algoarena/algoarena_sentiment_v4.py'
      - 'algoarena/algoarena_sentiment_v5.py'
      - 'algoarena/algoarena_sentiment_v6.py'
      - 'algoarena/algoarena_sharpe_v3.py'
      - 'algoarena/requirements.txt'
      - 'algoarena/tests/**'
      - '.github/workflows/sentiment-research.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: algoarena
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: algoarena/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Inspect representative competition headlines
        run: |
          python - <<'PY'
          import sessions
          data = sessions.get_ins_data()
          print("Headline samples and their release bars:")
          for i, (_, row) in enumerate(data.iloc[:12].iterrows(), 1):
              print(i, list(zip(row["headline_bars"], row["headlines"]))[:4])
          PY
      - name: Evaluate on official labelled parquet data
        run: python algoarena_sentiment_v4.py --no-submission --output-dir runs/github-validation
      - name: Test structured headlines on the same labelled data
        run: python algoarena_sentiment_v5.py --no-submission --output-dir runs/github-v5
      - name: Test company-aware headline selection
        run: python algoarena_sentiment_v6.py --no-submission --output-dir runs/github-v6
      - name: Print measured Sharpes
        if: success()
        run: |
          python - <<'PY'
          import json
          r=json.load(open("runs/github-validation/report.json"))
          print("Validation:",r["selection"]["oof_sharpe"])
          print("Audit Sharpe:",r["audit"]["sharpe"])
          print("Audit minus target:",r["audit"]["sharpe"]-3.65)
          print("Signal:",r["selection"]["kind"])
          v5=json.load(open("runs/github-v5/report.json"))
          print("v5 validation:",v5["selection"]["oof_sharpe"])
          print("v5 exploratory audit:",v5["audit"]["sharpe"])
          print("v5 minus v4 validation:",v5["selection"]["oof_sharpe"]-r["selection"]["oof_sharpe"])
          v6=json.load(open("runs/github-v6/report.json"))
          print("v6 validation:",v6["selection"]["oof_sharpe"])
          print("v6 exploratory audit:",v6["audit"]["sharpe"])
          print("v6 minus v4 validation:",v6["selection"]["oof_sharpe"]-r["selection"]["oof_sharpe"])
          PY
      - name: Save reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sentiment-debug
          path: |
            algoarena/runs/github-validation/
            algoarena/runs/github-v5/
            algoarena/runs/github-v6/
          if-no-files-found: warn
          retention-days: 14
