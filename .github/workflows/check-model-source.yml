name: Check submission source
on:
  pull_request:
    paths:
      - 'algoarena/model_3564.py'
      - 'algoarena/make_submission.py'
      - 'algoarena/requirements.txt'
      - 'algoarena/tests/test_model_3564.py'
      - '.github/workflows/check-model-source.yml'

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: algoarena
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m py_compile model_3564.py make_submission.py
      - run: python -m pytest -q tests/test_model_3564.py
