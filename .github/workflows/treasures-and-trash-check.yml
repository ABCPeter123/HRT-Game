name: Treasures and Trash decision panel

on:
  pull_request:
    paths:
      - 'treasures-and-trash/**'
      - 'scripts/build-site.mjs'
      - '.github/workflows/treasures-and-trash-check.yml'
  push:
    branches: [main]
    paths:
      - 'treasures-and-trash/**'
      - 'scripts/build-site.mjs'
      - '.github/workflows/treasures-and-trash-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: treasures-and-trash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check engine.js
      - run: node --check app.js
      - run: npm test
      - run: node ../scripts/build-site.mjs
      - run: test -f ../dist/treasures-and-trash/index.html && test -f ../dist/treasures-and-trash/engine.js
